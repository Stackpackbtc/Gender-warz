ext-align:center">No member selected.</div>';return}const me=(await sb.auth.getUser()).data.user||null,r=id?await sb.from('profiles').select('*').eq('id',id).maybeSingle():await sb.from('profiles').select('*').eq('username',username).maybeSingle();if(r.error||!r.data){app.innerHTML='<div class="status" style="padding:70px;text-align:center">This profile could not be loaded.</div>';return}const p=r.data,n=p.display_name||p.username||'Member',posts=await sb.from('posts').select('id',{count:'exact',head:true}).eq('author_id',p.id);let following=false;if(me&&me.id!==p.id){const f=await sb.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',p.id).maybeSingle();following=!!f.data}app.innerHTML='<div class="banner"'+(p.banner_url?' style="background-image:url(\''+esc(p.banner_url).replace(/'/g,'%27')+'\');background-size:cover;background-position:center"':'')+'></div><div class="body"><div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':initials(n))+'</div><div class="head"><div><div class="name">'+esc(n)+' '+(p.is_verified?'<span class="verified">✓</span>':'')+'</div><div class="handle">@'+esc(p.username||'member')+'</div></div></div><div class="actions">'+(me&&me.id!==p.id?'<button id="follow" class="btn '+(following?'following':'red')+'">'+(following?'FOLLOWING':'FOLLOW')+'</button>':'')+'<a class="btn" href="/social.html">⚔ WAR FLOOR</a></div><div class="bio">'+esc(p.bio||'This member has not added a bio yet.')+'</div><div class="meta">'+(p.location?'📍 '+esc(p.location):'')+(p.pronouns?' · '+esc(p.pronouns):'')+'</div><div class="stats"><div class="stat" id="followers"><strong>'+Number(p.followers_count||0)+'</strong><span>FOLLOWERS</span></div><div class="stat" id="following"><strong>'+Number(p.following_count||0)+'</strong><span>FOLLOWING</span></div><div class="stat"><strong>'+Number(posts.count||0)+'</strong><span>POSTS</span></div></div><div id="list" class="list"></div></div>';if(me&&me.id!==p.id)document.getElementById('follow').onclick=async()=>{const b=document.getElementById('follow');b.disabled=true;const old=await sb.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',p.id).maybeSingle();const r=old.data?await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',p.id):await sb.from('follows').insert({follower_id:me.id,following_id:p.id});if(r.error)toast(r.error.message);else{toast(old.data?'Unfollowed':'Following');await load()}b.disabled=false};document.getElementById('followers').onclick=()=>people(p.id,'followers');document.getElementById('following').onclick=()=>people(p.id,'following')}async function people(id,type){const box=document.getElementById('list');box.classList.add('open');box.innerHTML='<div class="status">Loading…</div>';const key=type==='followers'?'following_id':'follower_id',rows=await sb.from('follows').select('follower_id,following_id').eq(key,id).limit(100);if(rows.error||!rows.data?.length){box.innerHTML='<div class="status">No '+type+' yet.</div>';return}const ids=rows.data.map(x=>type==='followers'?x.follower_id:x.following_id),p=await sb.from('profiles').select('id,username,display_name,avatar_url,is_verified').in('id',ids),map={};(p.data||[]).forEach(x=>map[x.id]=x);box.innerHTML='<div class="status">'+type.toUpperCase()+'</div>';ids.forEach(id=>{const u=map[id];if(!u)return;const n=u.display_name||u.username||'Member',d=document.createElement('div');d.className='person';d.innerHTML='<div class="mini">'+(u.avatar_url?'<img src="'+esc(u.avatar_url)+'">':initials(n))+'</div><div><a href="'+url(u.id)+'">'+esc(n)+(u.is_verified?' ✓':'')+'</a><small>@'+esc(u.username||'member')+'</small></div>';box.appendChild(d)})}load();</script></body></html>
