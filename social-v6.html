<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gender Warz™ | War Floor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050505;--panel:#101012;--line:#29292d;--muted:#8a8a90;--red:#ff3347;--blue:#2da8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#191919,#050505 45%);color:#fff;font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.nav{position:sticky;top:0;z-index:30;height:62px;background:#050505ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{color:#fff;text-decoration:none;font-weight:1000;letter-spacing:3px}.brand b{color:var(--red)}.actions{display:flex;gap:7px}.btn{border:1px solid #444;background:#111;color:#fff;border-radius:999px;padding:10px 14px;font-size:10px;font-weight:1000}.red{background:var(--red);border-color:var(--red)}.wrap{width:min(1100px,100%);margin:auto;padding:14px 10px 80px}.stories{background:linear-gradient(145deg,#121214,#0a0a0b);border:1px solid var(--line);border-radius:20px;padding:13px;display:flex;gap:13px;overflow-x:auto;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{min-width:82px;width:82px;background:none;border:0;color:#aaa;padding:0;text-align:center}.ring{width:70px;height:70px;padding:3px;border-radius:50%;margin:auto;background:linear-gradient(135deg,var(--red),#ffd166,var(--blue))}.inner{height:100%;width:100%;border:3px solid #101012;border-radius:50%;overflow:hidden;background:#242428;display:grid;place-items:center;font-weight:1000}.inner img{height:100%;width:100%;object-fit:cover}.storyName{display:flex;justify-content:center;align-items:center;gap:3px;margin-top:5px;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--blue);font-size:8px;font-weight:1000}.layout{display:grid;grid-template-columns:minmax(0,700px) 290px;gap:14px;margin-top:14px}.card{background:linear-gradient(145deg,#111113,#0b0b0c);border:1px solid var(--line);border-radius:20px}.composer,.post,.side{padding:15px;margin-bottom:13px}.composeRow{display:flex;gap:10px}.avatar{width:46px;height:46px;min-width:46px;border-radius:50%;overflow:hidden;background:#29292d;display:grid;place-items:center;font-weight:1000}.avatar img{width:100%;height:100%;object-fit:cover}.composer textarea{width:100%;min-height:88px;background:#080809;color:#fff;border:1px solid #3a3a3e;border-radius:14px;padding:12px;resize:none;outline:none}.composerBar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.muted{color:var(--muted);font-size:10px}.postHead{display:flex;gap:10px;align-items:center}.postHead small{display:block;color:#777;font-size:10px;margin-top:3px}.body{white-space:pre-wrap;color:#ddd;line-height:1.55;margin:13px 0}.media{display:block;width:100%;max-height:620px;object-fit:contain;background:#000;border-radius:14px}.side{text-align:center}.side .avatar{width:100px;height:100px;margin:auto}.side h2{margin-bottom:4px}.modal{position:fixed;inset:0;background:#000d;backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{width:min(600px,100%);max-height:92vh;overflow:auto;background:#111113;border:1px solid #444;border-radius:22px;padding:18px}.sheetHead{display:flex;justify-content:space-between;align-items:center}.storyItem{display:flex;align-items:center;gap:10px;background:#09090a;border:1px solid #2d2d32;border-radius:14px;padding:9px;margin:9px 0}.thumb{width:62px;height:62px;min-width:62px;border-radius:10px;overflow:hidden;background:#222}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.storyInfo{flex:1;min-width:0}.storyInfo strong{display:block;font-size:11px}.storyInfo small{display:block;color:#777;font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.danger{background:#250b10!important;border-color:#a02a3b!important;color:#ff7b89!important}.viewer{width:min(470px,100%);max-height:94vh;background:#050505;border:1px solid #444;border-radius:22px;overflow:hidden;position:relative}.viewerMedia{background:#000}.viewerMedia img,.viewerMedia video{width:100%;max-height:70vh;display:block;object-fit:contain}.viewerMeta{padding:12px 15px 0}.viewerCaption{padding:8px 15px;color:#ddd;font-size:12px}.viewerBtns{display:flex;gap:7px;padding:10px 15px 15px}.viewerBtns a,.viewerBtns button{flex:1;text-align:center;text-decoration:none}.empty{text-align:center;color:#777;padding:22px;font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:999px;padding:11px 16px;font-size:11px;font-weight:1000;display:none;z-index:200}.toast.show{display:block}@media(max-width:780px){.layout{display:block}.side{display:none}.stories{border-radius:16px}.story{min-width:74px;width:74px}.ring{width:64px;height:64px}.viewer{width:100%;height:100dvh;max-height:none;border-radius:0}.viewerMedia img,.viewerMedia video{max-height:68dvh}}</style></head><body><nav class="nav"><a class="brand" href="/">GENDER <b>WARZ™</b></a><div class="actions"><button class="btn" id="manage">MY STORIES</button><button class="btn red" id="profile">PROFILE</button></div></nav><main class="wrap"><section class="stories" id="stories"><button class="story" id="add"><div class="ring"><div class="inner">＋</div></div><div class="storyName">Your story</div></button></section><div class="layout"><section><div class="card composer"><div class="composeRow"><div class="avatar" id="myAvatar">SP</div><textarea id="body" maxlength="1500" placeholder="Start a debate on the War Floor…"></textarea></div><div class="composerBar"><span class="muted" id="fileLabel">Photo/video optional</span><div><button class="btn" id="pick">MEDIA</button><button class="btn red" id="post">POST</button></div></div><input id="postFile" type="file" accept="image/*,video/*" hidden></div><div id="feed"></div></section><aside class="card side"><div class="avatar" id="sideAvatar">SP</div><h2 id="sideName">Member</h2><div class="muted" id="sideHandle">@member</div><p class="muted">Your public identity on the War Floor.</p><button class="btn red" id="sideProfile">VIEW PROFILE</button></aside></div></main><div class="modal" id="manageModal"><div class="sheet"><div class="sheetHead"><h3>MY ACTIVE STORIES</h3><button class="btn" id="closeManage">CLOSE</button></div><p class="muted">One bubble appears at the top for you. All active stories are managed below.</p><div id="mine"></div><hr style="border-color:#29292d;border-width:1px 0 0;margin:18px 0"><h4>POST A STORY</h4><input id="storyFile" type="file" accept="image/*,video/*" style="width:100%;padding:11px;background:#080809;border:1px solid #39393d;border-radius:10px;color:#fff"><input id="storyCaption" maxlength="300" placeholder="Add a caption…" style="width:100%;padding:11px;margin-top:8px;background:#080809;border:1px solid #39393d;border-radius:10px;color:#fff"><div id="storyError" class="muted"></div><button class="btn red" id="postStory" style="margin-top:10px">POST STORY</button></div></div><div class="modal" id="viewerModal"><div class="viewer"><button class="btn" id="closeViewer" style="position:absolute;right:10px;top:10px;z-index:2">×</button><div class="viewerMedia" id="viewerMedia"></div><div class="viewerMeta" id="viewerMeta"></div><div class="viewerCaption" id="viewerCaption"></div><div class="viewerBtns"><button class="btn red" id="next">NEXT</button><a class="btn" id="viewProfile" href="#">VIEW PROFILE</a><button class="btn danger" id="deleteCurrent" style="display:none">DELETE</button></div></div></div><div class="toast" id="toast"></div><script>const sb=window.supabase.createClient('https://kyxxslzvjaqmyzcvafzy.supabase.co','sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6'),BUCKET='social-media';let me=null,groups=[],current=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),initials=s=>String(s||'Member').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(),profileUrl=id=>'/public-profile.html?id='+encodeURIComponent(id);function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}function isVideo(s){return s.media_type==='video'||/\.(mp4|webm|mov|m4v)(\?|$)/i.test(s.media_url||'')}async function getMe(){const u=await sb.auth.getUser();me=u.data.user||null;if(!me){$('manage').textContent='LOG IN';$('profile').textContent='LOG IN';return}const p=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(p.data){const n=p.data.display_name||p.data.username||'Member',av=p.data.avatar_url;['myAvatar','sideAvatar'].forEach(id=>$(id).innerHTML=av?'<img src="'+esc(av)+'">':initials(n));$('sideName').textContent=n;$('sideHandle').textContent='@'+(p.data.username||'member')}}async function getStories(){const r=await sb.from('stories').select('id,author_id,user_id,media_url,media_type,caption,created_at,expires_at').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(200);if(r.error){toast('Stories could not load');return[]}const rows=r.data||[],ids=[...new Set(rows.map(s=>s.author_id||s.user_id).filter(Boolean))],ps={};if(ids.length){const p=await sb.from('profiles').select('id,username,display_name,avatar_url,is_verified').in('id',ids);(p.data||[]).forEach(x=>ps[x.id]=x)}rows.forEach(s=>s.profile=ps[s.author_id||s.user_id]||{});return rows}async function loadStories(){const rows=await getStories(),m={};rows.forEach(s=>{const id=s.author_id||s.user_id;if(id){m[id]??=[];m[id].push(s)}});groups=Object.values(m);document.querySelectorAll('[data-author]').forEach(x=>x.remove());const old=$('stories').querySelector('.empty');if(old)old.remove();if(!groups.length){$('stories').insertAdjacentHTML('beforeend','<div class="empty">No active stories yet.</div>');return}groups.forEach(g=>{const s=g[0],p=s.profile,n=p.display_name||p.username||'Member',b=document.createElement('button');b.className='story';b.dataset.author=s.author_id||s.user_id;b.innerHTML='<div class="ring"><div class="inner">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':initials(n))+'</div></div><div class="storyName">'+esc(n)+(p.is_verified?'<span class="verified">✓</span>':'')+'</div>';b.onclick=()=>openGroup(g,0);$('stories').appendChild(b)})}function openGroup(g,i){current={g,i};const s=g[i],p=s.profile,n=p.display_name||p.username||'Member';$('viewerMeta').innerHTML='<strong>'+esc(n)+'</strong>'+(p.is_verified?' <span class="verified">✓</span>':'')+' <span class="muted">'+(i+1)+'/'+g.length+'</span>';$('viewerCaption').textContent=s.caption||'';$('viewProfile').href=profileUrl(s.author_id||s.user_id);$('deleteCurrent').style.display=me&&(s.author_id||s.user_id)===me.id?'block':'none';$('viewerMedia').innerHTML='';if(isVideo(s)){const v=document.createElement('video');v.src=s.media_url;v.controls=true;v.autoplay=true;v.playsInline=true;v.muted=true;$('viewerMedia').appendChild(v)}else{$('viewerMedia').innerHTML='<img src="'+esc(s.media_url)+'" alt="Story">'}$('next').textContent=i<g.length-1?'NEXT':'CLOSE';$('viewerModal').classList.add('open')}function closeViewer(){const v=$('viewerMedia').querySelector('video');if(v)v.pause();$('viewerModal').classList.remove('open');current=null}$('closeViewer').onclick=closeViewer;$('next').onclick=()=>{if(!current)return;if(current.i<current.g.length-1)openGroup(current.g,current.i+1);else closeViewer()};$('deleteCurrent').onclick=()=>current&&deleteStory(current.g[current.i]);async function deleteStory(s){if(!me)return;if((s.author_id||s.user_id)!==me.id){toast('You can only delete your own story');return}if(!confirm('Delete this story permanently?'))return;let r=await sb.from('stories').delete().eq('id',s.id).or('author_id.eq.'+me.id+',user_id.eq.'+me.id);if(r.error){toast('Delete failed: '+r.error.message);return}const marker='/storage/v1/object/public/'+BUCKET+'/';const i=(s.media_url||'').indexOf(marker);if(i>=0){const path=decodeURIComponent(s.media_url.slice(i+marker.length));await sb.storage.from(BUCKET).remove([path])}toast('Story deleted');closeViewer();await loadStories();await loadMine()}async function loadMine(){if(!me){$('mine').innerHTML='<div class="empty">Log in first.</div>';return}const rows=(await getStories()).filter(s=>(s.author_id||s.user_id)===me.id);$('mine').innerHTML=rows.length?'':'<div class="empty">You have no active stories.</div>';rows.forEach(s=>{const d=document.createElement('div');d.className='storyItem';d.innerHTML='<div class="thumb">'+(isVideo(s)?'<video muted src="'+esc(s.media_url)+'"></video>':'<img src="'+esc(s.media_url)+'">')+'</div><div class="storyInfo"><strong>'+new Date(s.created_at).toLocaleString()+'</strong><small>'+esc(s.caption||'No caption')+'</small></div><button class="btn danger">DELETE STORY</button>';d.querySelector('button').onclick=()=>deleteStory(s);$('mine').appendChild(d)})}async function compressImage(file){const u=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const x=new Image();x.onload=()=>ok(x);x.onerror=no;x.src=u});const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,img.naturalWidth*scale);c.height=Math.max(1,img.naturalHeight*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/webp',.78))}finally{URL.revokeObjectURL(u)}}async function upload(file,folder){if(file.size>100*1024*1024)throw Error('File must be under 100 MB');let data=file,type=file.type.startsWith('video/')?'video':'image',ext=type==='video'?(file.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,''):'webp';if(type==='image')data=await compressImage(file);const path=me.id+'/'+folder+'/'+crypto.randomUUID()+'.'+ext,r=await sb.storage.from(BUCKET).upload(path,data,{contentType:type==='image'?'image/webp':file.type,upsert:false});if(r.error)throw r.error;return{url:sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,type}}$('manage').onclick=async()=>{if(!me){location.href='/members.html';return}$('manageModal').classList.add('open');await loadMine()};$('closeManage').onclick=()=>$('manageModal').classList.remove('open');$('add').onclick=async()=>{if(!me){location.href='/members.html';return}$('manageModal').classList.add('open');await loadMine()};$('postStory').onclick=async()=>{if(!me)return;const f=$('storyFile').files[0];if(!f){$('storyError').textContent='Choose an image or video.';return}try{const m=await upload(f,'stories'),r=await sb.from('stories').insert({author_id:me.id,user_id:me.id,media_url:m.url,media_type:m.type,caption:$('storyCaption').value.trim(),expires_at:new Date(Date.now()+86400000).toISOString()});if(r.error)throw r.error;$('storyFile').value='';$('storyCaption').value='';$('manageModal').classList.remove('open');toast('Story posted');await loadStories()}catch(e){$('storyError').textContent=e.message||'Upload failed'}};$('pick').onclick=()=>$('postFile').click();$('postFile').onchange=e=>$('fileLabel').textContent=e.target.files[0]?.name||'Photo/video optional';$('post').onclick=async()=>{if(!me){location.href='/members.html';return}const text=$('body').value.trim(),f=$('postFile').files[0];if(!text&&!f)return;try{let url=null,type=null;if(f){const m=await upload(f,'posts');url=m.url;type=m.type}const r=await sb.from('posts').insert({author_id:me.id,body:text,media_url:url,media_type:type});if(r.error)throw r.error;$('body').value='';$('postFile').value='';$('fileLabel').textContent='Photo/video optional';toast('Posted');await loadFeed()}catch(e){toast(e.message||'Post failed')}};async function loadFeed(){const r=await sb.from('posts').select('id,author_id,body,media_url,media_type,created_at').order('created_at',{ascending:false}).limit(50);const feed=$('feed');if(r.error){feed.innerHTML='<div class="empty">Posts could not load.</div>';return}const rows=r.data||[],ids=[...new Set(rows.map(x=>x.author_id).filter(Boolean))],ps={};if(ids.length){const p=await sb.from('profiles').select('id,username,display_name,avatar_url,is_verified').in('id',ids);(p.data||[]).forEach(x=>ps[x.id]=x)}feed.innerHTML=rows.length?'':'<div class="empty">No posts yet. Start the first debate.</div>';rows.forEach(p=>{const pr=ps[p.author_id]||{},n=pr.display_name||pr.username||'Member',el=document.createElement('article');el.className='card post';el.innerHTML='<div class="postHead"><div class="avatar">'+(pr.avatar_url?'<img src="'+esc(pr.avatar_url)+'">':initials(n))+'</div><div><strong>'+esc(n)+(pr.is_verified?'<span class="verified">✓</span>':'')+'</strong><small>@'+esc(pr.username||'member')+' · '+new Date(p.created_at).toLocaleString()+'</small></div></div>'+(p.body?'<div class="body">'+esc(p.body)+'</div>':'')+(p.media_url?(p.media_type==='video'?'<video class="media" controls src="'+esc(p.media_url)+'"></video>':'<img class="media" src="'+esc(p.media_url)+'">'):'');feed.appendChild(el)})}$('profile').onclick=()=>me?location.href=profileUrl(me.id):location.href='/members.html';$('sideProfile').onclick=()=>me?location.href=profileUrl(me.id):location.href='/members.html';async function init(){await getMe();await Promise.all([loadStories(),loadFeed()])}init();</script></body></html>
