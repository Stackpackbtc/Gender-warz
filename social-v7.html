h(g=>{const s=g[0],p=s.profile,n=p.display_name||p.username||'Member',b=document.createElement('button');b.className='story';b.dataset.owner=s.author_id||s.user_id;b.innerHTML='<div class="ring"><div class="inner">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':initials(n))+'</div></div><div class="name">'+esc(n)+'</div>';b.onclick=()=>openStory(g,0);$('stories').appendChild(b)})}function openStory(g,i){current={g,i};const s=g[i],p=s.profile||{},owner=s.author_id||s.user_id,n=p.display_name||p.username||'Member';$('storyMeta').textContent=n+' · '+(i+1)+'/'+g.length+' '+(s.caption||'');$('storyProfile').href='/public-profile.html?id='+encodeURIComponent(owner);$('storyDelete').style.display=me&&owner===me.id?'block':'none';$('storyDelete').onclick=()=>deleteStory(s);$('storyMedia').innerHTML=isVideo(s)?'<video src="'+esc(s.media_url)+'" controls autoplay muted playsinline></video>':'<img src="'+esc(s.media_url)+'">';$('next').textContent=i<g.length-1?'NEXT':'CLOSE';$('storyModal').classList.add('open')}async function deleteStory(s){if(!me||((s.author_id||s.user_id)!==me.id))return alert('Log in as the story owner to delete it.');if(!confirm('Delete this story permanently?'))return;const r=await sb.from('stories').delete().eq('id',s.id);if(r.error)return alert('Delete failed: '+r.error.message);$('storyModal').classList.remove('open');await loadStories()}$('next').onclick=()=>{if(!current)return current.i<current.g.length-1?openStory(current.g,current.i+1):$('storyModal').classList.remove('open')};$('mineBtn').onclick=async()=>{if(!me)return location.href='/members.html';$('manageModal').classList.add('open');const rows=(await sb.from('stories').select('*').eq('author_id',me.id).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false})).data||[];$('mine').innerHTML=rows.length?'':'<p style="color:#777">No active stories.</p>';rows.forEach(s=>{$('mine').insertAdjacentHTML('beforeend','<div class="item"><div class="thumb">'+(isVideo(s)?'<video
