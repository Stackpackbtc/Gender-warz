<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gender Warz™ | Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050505;--card:#101012;--line:#29292d;--muted:#888;--red:#ff3347;--blue:#2da8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.nav{height:60px;background:#050505f5;border-bottom:1px solid #242428;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10}.brand{color:#fff;text-decoration:none;font-weight:1000;letter-spacing:3px}.brand b{color:var(--red)}.btn{border:1px solid #3b3b40;background:#111113;color:#fff;border-radius:999px;padding:10px 14px;text-decoration:none;font-size:10px;font-weight:1000}.red{background:var(--red);border-color:var(--red)}.wrap{width:min(900px,100%);margin:auto;padding:18px 12px 70px}.profile{background:#0c0c0d;border:1px solid var(--line);border-radius:22px;overflow:hidden}.cover{height:260px;background:radial-gradient(circle at 25% 10%,#56121a,#100608 55%,#070707)}.body{padding:0 28px 30px}.avatar{width:140px;height:140px;border:6px solid #0c0c0d;border-radius:50%;margin-top:-70px;background:#242428;display:grid;place-items:center;overflow:hidden;font-size:38px;font-weight:1000;position:relative}.avatar img{width:100%;height:100%;object-fit:cover}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-top:14px}.name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.name h1{font-size:38px;letter-spacing:-2px;margin:0}.handle{color:#777;margin-top:5px}.verified{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--blue);font-size:13px;font-weight:1000}.badges{display:flex;gap:7px;margin:14px 0;flex-wrap:wrap}.badge{border:1px solid #444;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:1000}.bio{color:#ccc;font-size:15px;line-height:1.6}.meta{color:#777;font-size:11px;margin-top:12px;display:flex;gap:12px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}.stat{background:#111113;border:1px solid var(--line);border-radius:12px;text-align:center;padding:15px}.stat strong{display:block;font-size:21px}.stat span{display:block;color:#777;font-size:8px;letter-spacing:1px;margin-top:4px}.error{text-align:center;color:#ff6978;padding:80px 20px}.loading{text-align:center;color:#777;padding:80px 20px}@media(max-width:650px){.cover{height:210px}.body{padding:0 18px 24px}.avatar{width:120px;height:120px;margin-top:-60px}.head{display:block}.name h1{font-size:31px}.head .btn{margin-top:14px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}</style></head><body><nav class="nav"><a class="brand" href="/">GENDER <b>WARZ™</b></a><a class="btn" href="/social.html">WAR FLOOR</a></nav><main class="wrap"><section class="profile" id="app"><div class="loading">Loading profile…</div></section></main><script>const sb=window.supabase.createClient('https://kyxxslzvjaqmyzcvafzy.supabase.co','sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6'),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=s=>String(s||'Member').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();async function load(){const q=new URLSearchParams(location.search),id=q.get('id'),username=q.get('username');if(!id&&!username){app.innerHTML='<div class="error">No profile was specified.</div>';return}let query=sb.from('profiles').select('*');query=id?query.eq('id',id):query.eq('username',username);const r=await query.maybeSingle();if(r.error){app.innerHTML='<div class="error">Profile could not be loaded.</div>';return}if(!r.data){app.innerHTML='<div class="error">That member profile does not exist yet.</div>';return}const p=r.data,n=p.display_name||p.username||'Member',av=p.avatar_url;const [postCount,followers,following]=await Promise.all([sb.from('posts').select('id',{count:'exact',head:true}).eq('author_id',p.id),sb.from('follows').select('id',{count:'exact',head:true}).eq('following_id',p.id),sb.from('follows').select('id',{count:'exact',head:true}).eq('follower_id',p.id)]);const website=p.website||p.website_url;app.innerHTML='<div class="cover"'+(p.banner_url?' style="background-image:url(\''+esc(p.banner_url).replace(/'/g,'%27')+'\');background-size:cover;background-position:center"':'')+'></div><div class="body"><div class="avatar">'+(av?'<img src="'+esc(av)+'" alt="'+esc(n)+'">':initials(n))+'</div><div class="head"><div><div class="name"><h1>'+esc(n)+'</h1>'+(p.is_verified?'<span class="verified">✓</span>':'')+'</div><div class="handle">@'+esc(p.username||'member')+'</div></div><a class="btn red" href="/social.html">⚔ WAR FLOOR</a></div><div class="badges">'+(p.is_verified?'<span class="badge">✓ VERIFIED</span>':'')+(p.is_admin?'<span class="badge">★ OFFICIAL ADMIN</span>':'')+'</div><div class="bio">'+esc(p.bio||'This member has not added a bio yet.')+'</div><div class="meta"><span>📍 '+esc(p.location||'Location not listed')+'</span>'+(website?'<a style="color:#aaa" href="'+esc(website)+'" target="_blank" rel="noopener">🔗 '+esc(website.replace(/^https?:\/\//,''))+'</a>':'')+'</div><div class="stats"><div class="stat"><strong>'+(followers.count||0)+'</strong><span>Followers</span></div><div class="stat"><strong>'+(following.count||0)+'</strong><span>Following</span></div><div class="stat"><strong>'+(postCount.count||0)+'</strong><span>Posts</span></div></div></div>'}load();</script></body></html>
