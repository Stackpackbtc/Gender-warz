<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gender Warz™ | War Floor</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050505;--card:#101012;--line:#29292d;--muted:#888;--red:#ff3347;--blue:#2da8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.nav{position:sticky;top:0;z-index:30;height:60px;background:#050505f5;border-bottom:1px solid #242428;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{color:#fff;text-decoration:none;font-weight:1000;letter-spacing:3px}.brand b{color:var(--red)}.actions{display:flex;gap:7px}.btn{border:1px solid #3b3b40;background:#111113;color:#fff;border-radius:999px;padding:10px 14px;font-size:10px;font-weight:1000}.red{background:var(--red);border-color:var(--red)}.wrap{width:min(1050px,100%);margin:auto;padding:12px 10px 80px}.stories{display:flex;align-items:flex-start;gap:14px;padding:14px 12px;overflow-x:auto;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{min-width:78px;width:78px;border:0;background:none;color:#aaa;text-align:center;padding:0}.ring{width:70px;height:70px;padding:3px;border-radius:50%;margin:auto;background:linear-gradient(135deg,#ff3347,#ffd166,#2da8ff)}.inner{width:100%;height:100%;border:3px solid #101012;border-radius:50%;overflow:hidden;background:#202023;display:grid;place-items:center;font-weight:1000}.inner img{width:100%;height:100%;object-fit:cover}.storyName{margin-top:5px;font-size:9px;display:flex;justify-content:center;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--blue);font-size:8px;font-weight:1000;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,680px) 280px;gap:14px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.composer,.post,.profileCard{padding:14px;margin-bottom:12px}.composerRow{display:flex;gap:10px}.avatar{width:45px;height:45px;min-width:45px;border-radius:50%;overflow:hidden;background:#29292d;display:grid;place-items:center;font-weight:1000}.avatar img{width:100%;height:100%;object-fit:cover}.composer textarea{width:100%;min-height:80px;background:#080809;border:1px solid #3a3a3e;border-radius:12px;color:#fff;padding:12px;resize:none;outline:none}.composerBar{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.muted{font-size:10px;color:#777}.postHead{display:flex;gap:10px;align-items:center}.postHead small{display:block;color:#777;font-size:10px;margin-top:3px}.body{white-space:pre-wrap;color:#ddd;line-height:1.5;margin:12px 0}.media{width:100%;max-height:650px;object-fit:contain;background:#000;border-radius:12px}.side{text-align:center}.side .avatar{width:100px;height:100px;margin:auto}.modal{position:fixed;inset:0;background:#000e;z-index:100;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:#111113;border:1px solid #3a3a3e;border-radius:18px;padding:18px}.storyItem{display:flex;align-items:center;gap:10px;border:1px solid #2c2c31;background:#09090a;border-radius:12px;padding:8px;margin:8px 0}.thumb{width:60px;height:60px;min-width:60px;border-radius:9px;overflow:hidden;background:#222}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.storyInfo{flex:1;min-width:0}.storyInfo strong{display:block;font-size:11px}.storyInfo small{display:block;color:#777;font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.delete{background:#260b10;border-color:#9b2938;color:#ff7b89}.viewer{width:min(450px,100%);max-height:94vh;background:#050505;border:1px solid #333;border-radius:18px;overflow:hidden}.viewerMedia{background:#000}.viewerMedia img,.viewerMedia video{width:100%;max-height:70vh;display:block;object-fit:contain}.viewerMeta{padding:12px 14px 0;font-size:11px}.viewerCaption{padding:8px 14px;color:#ddd;font-size:12px}.viewerBtns{display:flex;gap:7px;padding:10px 14px 14px}.viewerBtns button,.viewerBtns a{flex:1;border:1px solid #444;background:#111;border-radius:999px;color:#fff;text-align:center;padding:11px 6px;font-size:9px;font-weight:1000;text-decoration:none}.viewerBtns .red{background:var(--red);border-color:var(--red)}.error{color:#ff6978;font-size:11px}.empty{padding:25px;text-align:center;color:#777;font-size:11px}@media(max-width:760px){.layout{display:block}.side{display:none}.story{min-width:70px;width:70px}.ring{width:64px;height:64px}.viewer{width:100%;height:100dvh;max-height:none;border-radius:0}.viewerMedia img,.viewerMedia video{max-height:70dvh}}</style></head><body><nav class="nav"><a class="brand" href="/">GENDER <b>WARZ™</b></a><div class="actions"><button class="btn" id="manageBtn">MY STORIES</button><button class="btn red" id="profileBtn">PROFILE</button></div></nav><main class="wrap"><section class="card stories" id="storyRow"><button class="story" id="addStory"><div class="ring"><div class="inner">＋</div></div><div class="storyName">Your story</div></button><div class="empty" id="storyLoading">Loading stories…</div></section><div class="layout"><section><div class="card composer"><div class="composerRow"><div class="avatar" id="myAvatar">SP</div><textarea id="postBody" maxlength="1000" placeholder="What's happening on the War Floor?"></textarea></div><div class="composerBar"><span class="muted" id="mediaLabel">Add a photo or video</span><div><button class="btn" id="mediaBtn">MEDIA</button><button class="btn red" id="postBtn">POST</button></div></div><input id="postFile" type="file" accept="image/*,video/*" hidden></div><div id="feed"></div></section><aside class="card profileCard side"><div class="avatar" id="sideAvatar">SP</div><h2 id="sideName">Member</h2><div class="muted" id="sideHandle">@member</div><p class="muted">Your Gender Warz profile, bio and community identity.</p><button class="btn red" id="sideProfile">VIEW MY PROFILE</button></aside></div></main><div class="modal" id="manageModal"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3>MY ACTIVE STORIES</h3><button class="btn" id="closeManage">CLOSE</button></div><p class="muted">One bubble appears at the top for you. All of your active stories are managed here.</p><div id="myStories"></div><hr style="border-color:#29292d;border-width:1px 0 0;margin:18px 0"><h4>POST A STORY</h4><input id="storyFile" type="file" accept="image/*,video/*" style="width:100%;padding:10px;background:#080809;border:1px solid #39393d;border-radius:10px;color:#fff"><input id="storyCaption" maxlength="300" placeholder="Story caption" style="width:100%;padding:10px;margin-top:8px;background:#080809;border:1px solid #39393d;border-radius:10px;color:#fff"><div id="storyError" class="error" style="margin-top:7px"></div><button class="btn red" id="postStory" style="margin-top:10px">POST STORY</button></div></div><div class="modal" id="viewerModal"><div class="viewer"><div class="viewerMedia" id="viewerMedia"></div><div class="viewerMeta" id="viewerMeta"></div><div class="viewerCaption" id="viewerCaption"></div><div class="viewerBtns"><button class="red" id="watchBtn">WATCH</button><a id="viewProfile" href="#">VIEW PROFILE</a><button class="delete" id="deleteCurrent" style="display:none">DELETE</button></div><button class="btn" id="closeViewer" style="position:absolute;top:10px;right:10px">×</button></div></div><script>const supabase=window.supabase.createClient('https://kyxxslzvjaqmyzcvafzy.supabase.co','sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6');const BUCKET='social-media';let me=null,meProfile=null,storyGroups=[],currentStory=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=s=>String(s||'Member').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();const purl=id=>'/public-profile.html?id='+encodeURIComponent(id);function setProfile(p){meProfile=p||{};const n=p?.display_name||p?.username||'Member',av=p?.avatar_url;['myAvatar','sideAvatar'].forEach(id=>$(id).innerHTML=av?'<img src="'+esc(av)+'">':initials(n));$('sideName').textContent=n;$('sideHandle').textContent='@'+(p?.username||'member')}async function loadMe(){const u=await supabase.auth.getUser();me=u.data.user;if(!me){$('manageBtn').textContent='LOG IN';return}const r=await supabase.from('profiles').select('*').eq('id',me.id).maybeSingle();if(r.data)setProfile(r.data);$('profileBtn').onclick=()=>location.href=purl(me.id);$('sideProfile').onclick=()=>location.href=purl(me.id)}async function getStories(){const r=await supabase.from('stories').select('id,author_id,user_id,media_url,media_type,caption,created_at,expires_at').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(100);if(r.error){console.error(r.error);return[]}const rows=r.data||[];const ids=[...new Set(rows.map(x=>x.author_id||x.user_id).filter(Boolean))];let profiles={};if(ids.length){const pr=await supabase.from('profiles').select('id,username,display_name,avatar_url,is_verified').in('id',ids);(pr.data||[]).forEach(p=>profiles[p.id]=p)}rows.forEach(s=>s.profiles=profiles[s.author_id||s.user_id]||{});return rows}async function loadStories(){const rows=await getStories(),map={};rows.forEach(s=>{const id=s.author_id||s.user_id;if(id){if(!map[id])map[id]=[];map[id].push(s)}});storyGroups=Object.values(map);$('storyLoading')?.remove();$('storyRow').querySelectorAll('[data-author]').forEach(x=>x.remove());if(!storyGroups.length&&!$('storyRow').querySelector('.empty')){$('storyRow').insertAdjacentHTML('beforeend','<div class="empty">No active stories right now.</div>')}storyGroups.forEach(group=>{const s=group[0],p=s.profiles||{},n=p.display_name||p.username||'Member',b=document.createElement('button');b.className='story';b.dataset.author=s.author_id||s.user_id;b.innerHTML='<div class="ring"><div class="inner">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':initials(n))+'</div></div><div class="storyName">'+esc(n)+(p.is_verified?'<span class="verified">✓</span>':'')+'</div>';b.onclick=()=>openStory(group,0);$('storyRow').appendChild(b)})}function openStory(group,index){currentStory={group,index};const s=group[index],p=s.profiles||{},n=p.display_name||p.username||'Member';$('viewerMeta').innerHTML='<strong>'+esc(n)+'</strong>'+(p.is_verified?' <span class="verified">✓</span>':'');$('viewerCaption').textContent=s.caption||'';$('viewProfile').href=purl(s.author_id||s.user_id);$('deleteCurrent').style.display=me&&((s.author_id||s.user_id)===me.id)?'block':'none';$('viewerMedia').innerHTML='';if(s.media_type==='video'){const v=document.createElement('video');v.src=s.media_url;v.controls=true;v.autoplay=true;v.playsInline=true;v.muted=true;$('viewerMedia').appendChild(v)}else{$('viewerMedia').innerHTML='<img src="'+esc(s.media_url)+'" alt="Story">'}$('viewerModal').classList.add('open')}async function deleteStory(s){if(!me||!s)return;const owner=s.author_id||s.user_id;if(owner!==me.id){alert('You can only delete your own story.');return}if(!confirm('Delete this story permanently?'))return;const r=await supabase.from('stories').delete().eq('id',s.id).eq('author_id',me.id);if(r.error){alert('Delete failed: '+r.error.message);return}const marker='/storage/v1/object/public/'+BUCKET+'/';const i=(s.media_url||'').indexOf(marker);if(i>=0){const path=decodeURIComponent(s.media_url.slice(i+marker.length));await supabase.storage.from(BUCKET).remove([path])}if(currentStory){const left=currentStory.group.filter(x=>x.id!==s.id);if(left.length)openStory(left,Math.min(currentStory.index,left.length-1));else closeViewer()}await loadStories();await loadMine();}async function loadMine(){if(!me){$('myStories').innerHTML='<div class="empty">Log in to manage your stories.</div>';return}const rows=await getStories(),mine=rows.filter(s=>(s.author_id||s.user_id)===me.id);$('myStories').innerHTML=mine.length?'':'<div class="empty">You have no active stories.</div>';mine.forEach(s=>{const d=document.createElement('div');d.className='storyItem';d.innerHTML='<div class="thumb">'+(s.media_type==='video'?'<video muted src="'+esc(s.media_url)+'"></video>':'<img src="'+esc(s.media_url)+'">')+'</div><div class="storyInfo"><strong>'+new Date(s.created_at).toLocaleString()+'</strong><small>'+(s.caption?esc(s.caption):'No caption')+'</small></div><button class="btn delete">DELETE STORY</button>';d.querySelector('button').onclick=()=>deleteStory(s);$('myStories').appendChild(d)})}function closeViewer(){const v=$('viewerMedia').querySelector('video');if(v)v.pause();$('viewerMedia').innerHTML='';$('viewerModal').classList.remove('open');currentStory=null}$('manageBtn').onclick=async()=>{if(!me){location.href='/members.html';return}$('manageModal').classList.add('open');await loadMine()};$('closeManage').onclick=()=>$('manageModal').classList.remove('open');$('addStory').onclick=async()=>{$('manageModal').classList.add('open');await loadMine()};$('closeViewer').onclick=closeViewer;$('deleteCurrent').onclick=()=>currentStory&&deleteStory(currentStory.group[currentStory.index]);$('watchBtn').onclick=()=>{const v=$('viewerMedia').querySelector('video');if(v){v.muted=false;v.play().catch(()=>{})}};$('mediaBtn').onclick=()=>$('postFile').click();$('postFile').onchange=e=>$('mediaLabel').textContent=e.target.files[0]?.name||'Add a photo or video';$('postBtn').onclick=async()=>{if(!me){location.href='/members.html';return}const body=$('postBody').value.trim(),f=$('postFile').files[0];if(!body&&!f)return;let url=null,type=null;if(f){const path=me.id+'/posts/'+crypto.randomUUID()+'-'+f.name.replace(/[^a-z0-9._-]/gi,'');const r=await supabase.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(r.error){alert(r.error.message);return}url=supabase.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;type=f.type.startsWith('video/')?'video':'image'}const r=await supabase.from('posts').insert({author_id:me.id,body,media_url:url,media_type:type});if(r.error){alert(r.error.message);return}$('postBody').value='';$('postFile').value='';await loadPosts()};async function loadPosts(){const r=await supabase.from('posts').select('id,author_id,body,media_url,media_type,created_at').order('created_at',{ascending:false}).limit(50);const rows=r.data||[];const ids=[...new Set(rows.map(x=>x.author_id).filter(Boolean))];let ps={};if(ids.length){const q=await supabase.from('profiles').select('id,username,display_name,avatar_url,is_verified').in('id',ids);(q.data||[]).forEach(p=>ps[p.id]=p)}$('feed').innerHTML=rows.length?'':'<div class="empty">No posts yet.</div>';rows.forEach(p=>{const pr=ps[p.author_id]||{},n=pr.display_name||pr.username||'Member',a=document.createElement('article');a.className='card post';a.innerHTML='<div class="postHead"><div class="avatar">'+(pr.avatar_url?'<img src="'+esc(pr.avatar_url)+'">':initials(n))+'</div><div><strong>'+esc(n)+(pr.is_verified?'<span class="verified">✓</span>':'')+'</strong><small>@'+esc(pr.username||'member')+'</small></div></div>'+(p.body?'<div class="body">'+esc(p.body)+'</div>':'')+(p.media_url?(p.media_type==='video'?'<video class="media" controls src="'+esc(p.media_url)+'"></video>':'<img class="media" src="'+esc(p.media_url)+'">'):'');$('feed').appendChild(a)})}$('viewerModal').onclick=e=>{if(e.target===$('viewerModal'))closeViewer()};(async()=>{await loadMe();await Promise.all([loadStories(),loadPosts()])})();</script></body></html>
