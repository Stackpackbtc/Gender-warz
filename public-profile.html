rgin:0}.check{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--blue);font-size:14px;font-weight:1000}.handle{color:#777;font-size:13px;margin-top:5px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.badge{border:1px solid #3b3b40;border-radius:999px;padding:6px 10px;font-size:9px;font-weight:1000;letter-spacing:1px}.verify{border-color:var(--blue);color:#75c9ff;background:#071725}.admin{border-color:#b99632;color:#ffd166;background:#1c1708}.bio{color:#c3c3c8;line-height:1.65;font-size:15px;max-width:750px}.meta{display:flex;gap:15px;flex-wrap:wrap;color:#777;font-size:12px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:25px 0}.stat{background:#111113;border:1px solid #28282c;border-radius:12px;padding:15px;text-align:center}.stat strong{display:block;font-size:21px}.stat span{display:block;color:#777;font-size:8px;text-transform:uppercase;letter-spacing:1.2px;margin-top:4px}.empty{text-align:center;padding:80px 20px;color:#888}.error{color:#ff6472}.section{margin-top:20px;padding:20px;background:#111113;border:1px solid #29292d;border-radius:16px}.tag{font-size:9px;font-weight:1000;letter-spacing:3px;color:var(--red)}.section h2{margin:8px 0}.section p{color:#999;line-height:1.6}@media(max-width:650px){.top{padding:0 14px}.cover{height:210px}.body{padding:0 18px 24px}.avatar{width:120px;height:120px;margin-top:-60px;border-width:5px}.head{display:block}.name h1{font-size:32px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}</style></head><body><header class="top"><a class="brand" href="/">GENDER <b>WARZ™</b></a><a class="btn" href="/social.html">WAR FLOOR</a></header><main class="wrap"><div id="app" class="profile"><div class="empty">Loading profile…</div></div></main><script>const URL='https://kyxxslzvjaqmyzcvafzy.supabase.co',KEY='sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6',sb=window.supabase.createClient(URL,KEY),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=s=>String(s||'Member').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();async function load(){const params=new URLSearchParams(location.search),id=params.get('id'),username=params.get('username');if(!id&&!username){app.innerHTML='<div class="empty error">No member was specified.</div>';return}let q=sb.from('profiles').select('*');q=id?q.eq('id',id):q.eq('username',username);const r=await q.maybeSingle();if(r.error||!r.data){app.innerHTML='<div class="empty error">That member profile could not be found.</div>';return}const p=r.data,name=p.display_name||p.username||'Member',handle=p.username?'@'+p.username:'',verified=!!p.is_verified,cover=p.cover_url||'',avatar=p.avatar_url;let posts=0,followers=0,following=0;try{const [a,b,c]=await Promise.all([sb.from('posts').select('id',{count:'exact',head:true}).eq('user_id',p.id),sb.from('follows').select('id',{count:'exact',head:true}).eq('following_id',p.id),sb.from('follows').select('id',{count:'exact',head:true}).eq('follower_id',p.id)]);posts=a.count||0;followers=b.count||0;following=c.count||0}catch(e){}const website=p.website?'<a href="'+esc(p.website)+'" target="_blank" rel="noopener">🔗 '+esc(p.website.replace(/^https?:\/\//,''))+'</a>':'🔗 Gender Warz';app.innerHTML='<div class="cover" style="'+(cover?'background-image:url(\''+esc(cover).replace(/'/g,'%27')+'\')':'')+'"></div><div class="body"><div class="avatar">'+(avatar?'<img src="'+esc(avatar)+'" alt="'+esc(name)+'">':esc(initials(name)))+'</div><div class="head"><div><div class="name"><h1>'+esc(name)+'</h1>'+(verified?'<span class="check" title="Verified">✓</span>':'')+'</div><div class="handle">'+esc(handle)+'</div></div><a class="btn red" href="/social.html">⚔ WAR FLOOR</a></div><div class="badges">'+(verified?'<span class="badge verify">✓ VERIFIED</span>':'')+(p.is_admin?'<span class="badge admin">★ OFFICIAL ADMIN
