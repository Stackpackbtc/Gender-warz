<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gender Warz™ | Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#050507;--card:#101116;--line:#282932;--text:#f7f7fa;--muted:#92929d;--red:#ff3048;--purple:#8b35ff;--blue:#3295ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#31105a44,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.nav{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;background:#050507eF;backdrop-filter:blur(16px);z-index:5}.brand{font-weight:1000;letter-spacing:2px}.brand b{color:var(--red)}.btn{border:1px solid var(--line);background:#121218;color:#fff;border-radius:999px;padding:10px 14px;font-size:10px;font-weight:900;text-decoration:none;cursor:pointer}.red{background:var(--red);border-color:var(--red)}.following{background:#fff;color:#111;border-color:#fff}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 50px #0007}.banner{height:250px;background:radial-gradient(circle at 70% 35%,#8b35ff66,transparent 25%),linear-gradient(135deg,#08080b,#260817 55%,#08080b);position:relative}.banner:after{content:'GENDER WARZ';position:absolute;inset:0;display:grid;place-items:center;font-size:50px;font-weight:1000;letter-spacing:-3px;color:#fff;text-shadow:0 0 25px #ff304888;transform:rotate(-5deg)}.body{padding:0 28px 30px}.avatar{width:142px;height:142px;margin-top:-70px;border:6px solid var(--card);border-radius:50%;overflow:hidden;background:#202027;display:grid;place-items:center;font-size:40px;font-weight:1000;position:relative}.avatar img{width:100%;height:100%;object-fit:cover}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.name{font-size:36px;font-weight:1000;letter-spacing:-1.5px}.verified{display:inline-grid;place-items:center;background:var(--blue);border-radius:50%;width:21px;height:21px;font-size:12px;vertical-align:middle}.handle{color:var(--muted);margin-top:5px}.bio{color:#c6c6ce;line-height:1.65;margin:18px 0;max-width:650px}.meta{color:var(--muted);font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.stat{background:#0b0b10;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;cursor:pointer}.stat strong{display:block;font-size:24px}.stat span{display:block;color:var(--muted);font-size:9px;letter-spacing:1px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.list{display:none;margin-top:14px;background:#0b0b10;border:1px solid var(--line);border-radius:14px;padding:10px}.list.open{display:block}.person{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.person:last-child{border:0}.mini{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#24242a;display:grid;place-items:center;font-weight:900}.mini img{width:100%;height:100%;object-fit:cover}.person a{font-weight:900}.person small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.status{color:var(--muted);font-size:11px;padding:15px;text-align:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:11px 16px;font-size:11px;font-weight:900;display:none}.toast.show{display:block}@media(max-width:600px){.nav{padding:0 12px}.wrap{padding:10px}.banner{height:190px}.banner:after{font-size:35px}.body{padding:0 17px 22px}.name{font-size:28px}.head{display:block}.actions{margin-top:14px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}
</style></head><body><nav class="nav"><a class="brand" href="/">GENDER <b>WARZ™</b></a><a class="btn" href="/social.html">⚔ WAR FLOOR</a></nav><main class="wrap"><section class="card" id="app"><div class="status" style="padding:80px">Loading profile…</div></section></main><div class="toast" id="toast"></div><script>const sb=window.supabase.createClient('https://kyxxslzvjaqmyzcvafzy.supabase.co','sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6'),app=document.getElementById('app'),toastEl=document.getElementById('toast');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=s=>String(s||'Member').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();function toast(x){toastEl.textContent=x;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}function url(id){return '/public-profile.html?id='+encodeURIComponent(id)}async function load(){const q=new URLSearchParams(location.search),id=q.get('id'),username=q.get('username');if(!id&&!username){app.innerHTML='<div class="status" style="padding:80px">No member selected.</div>';return}const me=(await sb.auth.getUser()).data.user||null;const r=id?await sb.from('profiles').select('*').eq('id',id).maybeSingle():await sb.from('profiles').select('*').eq('username',username).maybeSingle();if(r.error||!r.data){app.innerHTML='<div class="status" style="padding:80px">This profile could not be loaded.</div>';return}const p=r.data,n=p.display_name||p.username||'Member',isStack=String(p.username||'').toLowerCase()==='stackpack'||String(n).toLowerCase().includes('stackpack'),postQ=await sb.from('posts').select('id',{count:'exact',head:true}).eq('author_id',p.id);let following=false;if(me&&me.id!==p.id){const f=await sb.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',p.id).maybeSingle();following=!!f.data}const followers=isStack?Math.max(Number(p.followers_count||0),40000):Number(p.followers_count||0);app.innerHTML='<div class="banner"></div><div class="body"><div class="avatar">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'">':esc(initials(n)))+'</div><div class="head"><div><div class="name">'+esc(n)+' '+(p.is_verified||isStack?'<span class="verified">✓</span>':'')+'</div><div class="handle">@'+esc(p.username||'member')+'</div></div></div><div class="actions">'+(me&&me.id!==p.id?'<button id="follow" class="btn '+(following?'following':'red')+'">'+(following?'FOLLOWING':'FOLLOW')+'</button>':'')+'<a class="btn" href="/social.html">⚔ WAR FLOOR</a></div><div class="bio">'+esc(p.bio||'Real conversations. Real people. Real change.')+'</div><div class="meta">'+(p.location?'📍 '+esc(p.location):'')+(p.pronouns?' · '+esc(p.pronouns):'')+'</div><div class="stats"><div class="stat" id="followers"><strong>'+followers.toLocaleString()+(isStack?'+':'')+'</strong><span>FOLLOWERS</span></div><div class="stat" id="following"><strong>'+Number(p.following_count||0).toLocaleString()+'</strong><span>FOLLOWING</span></div><div class="stat"><strong>'+Number(postQ.count||0).toLocaleString()+'</strong><span>POSTS</span></div></div><div id="list" class="list"></div></div>';if(me&&me.id!==p.id)document.getElementById('follow').onclick=async()=>{const b=document.getElementById('follow');b.disabled=true;const old=await sb.from('follows').select('follower_id').eq('follower_id',me.id).eq('following_id',p.id).maybeSingle();const r=old.data?await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',p.id):await sb.from('follows').insert({follower_id:me.id,following_id:p.id});if(r.error)toast(r.error.message);else{toast(old.data?'Unfollowed':'Following');await load()}b.disabled=false};document.getElementById('followers').onclick=()=>people(p.id,'followers');document.getElementById('following').onclick=()=>people(p.id,'following')}async function people(id,type){const box=document.getElementById('list');box.classList.add('open');box.innerHTML='<div class="status">Loading…</div>';const key=type==='followers'?'following_id':'follower_id',rows=await sb.from('follows').select('follower_id,following_id').eq(key,id).limit(100);if(rows.error||!rows.data?.length){box.innerHTML='<div class="status">No '+type+' yet.</div>';return}const ids=rows.data.map(x=>type==='followers'?x.follower_id:x.following_id),p=await sb.from('profiles').select('id,username,display_name,avatar_url,is_verified').in('id',ids),map={};(p.data||[]).forEach(x=>map[x.id]=x);box.innerHTML='<div class="status">'+type.toUpperCase()+'</div>';ids.forEach(i=>{const u=map[i];if(!u)return;const n=u.display_name||u.username||'Member',d=document.createElement('div');d.className='person';d.innerHTML='<div class="mini">'+(u.avatar_url?'<img src="'+esc(u.avatar_url)+'">':esc(initials(n)))+'</div><div><a href="'+url(u.id)+'">'+esc(n)+(u.is_verified?' ✓':'')+'</a><small>@'+esc(u.username||'member')+'</small></div>';box.appendChild(d)})}load();</script></body></html>
