<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gender Warz™ | Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050505;--card:#101012;--line:#29292d;--muted:#8d8d94;--white:#f7f7f8;--red:#ff3347;--blue:#2da8ff;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;height:64px;background:#050505f5;backdrop-filter:blur(14px);border-bottom:1px solid #242428;display:flex;align-items:center;justify-content:space-between;padding:0 max(14px,calc((100vw - 1050px)/2))}.brand{color:#fff;text-decoration:none;font-weight:1000;letter-spacing:3px}.brand b{color:var(--red)}.top .actions{display:flex;gap:8px}.pill{border:1px solid #3a3a3e;background:#111113;color:#fff;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:900}.red{background:var(--red)!important;border-color:var(--red)!important}.wrap{width:min(1050px,100%);margin:auto;padding:12px 10px 80px}.layout{display:grid;grid-template-columns:minmax(0,680px) 280px;gap:14px}.card{background:#0d0d0f;border:1px solid var(--line);border-radius:18px}.storiesCard{padding:14px 12px;margin-bottom:12px}.sectionTitle{font-size:11px;font-weight:1000;letter-spacing:1.2px;margin:0 0 12px}.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{min-width:72px;width:72px;text-align:center;color:#aaa;font-size:10px;overflow:hidden}.ring{width:70px;height:70px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#ff3347,#ffd166,#2da8ff);margin:auto auto 5px}.ringInner{width:100%;height:100%;border:3px solid #0d0d0f;border-radius:50%;overflow:hidden;background:#19191c;display:grid;place-items:center}.ringInner img{width:100%;height:100%;object-fit:cover}.add .ringInner{font-size:28px}.composer{padding:14px;margin-bottom:12px}.composerTop{display:flex;gap:10px;align-items:flex-start}.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:#27272b;display:grid;place-items:center;overflow:hidden;font-weight:1000}.avatar img{width:100%;height:100%;object-fit:cover}.composer textarea{width:100%;min-height:74px;resize:none;background:#080809;border:1px solid #39393d;border-radius:12px;color:#fff;padding:12px;outline:none}.composer textarea:focus{border-color:#555}.composerBar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}.hint{color:#777;font-size:10px}.post{padding:14px;margin-bottom:12px}.postHead{display:flex;align-items:center;gap:10px}.postHead strong{font-size:13px}.postHead small{display:block;color:#777;margin-top:2px;font-size:10px}.verified{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--blue);font-size:10px;font-weight:1000;margin-left:3px}.bodyText{white-space:pre-wrap;color:#ddd;line-height:1.5;margin:12px 0}.media{width:100%;max-height:600px;object-fit:cover;border-radius:12px;border:1px solid #29292d}.empty{padding:30px;text-align:center;color:#777;border:1px dashed #303035;border-radius:12px}.side{padding:16px;height:max-content;position:sticky;top:78px}.sideProfile{text-align:center}.bigAvatar{width:92px;height:92px;border-radius:50%;margin:auto;background:#252529;display:grid;place-items:center;overflow:hidden;font-size:28px;font-weight:1000}.bigAvatar img{width:100%;height:100%;object-fit:cover}.side h2{margin:10px 0 2px;font-size:21px}.handle{color:#777;font-size:11px}.badges{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:12px 0}.badge{font-size:8px;font-weight:1000;letter-spacing:1px;border-radius:999px;padding:6px 8px;border:1px solid #3a3a3e}.blue{color:#7dceff;border-color:#2da8ff;background:#071725}.gold{color:#ffd166;border-color:#b99632;background:#1c1708}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{background:#111113;border:1px solid #29292d;border-radius:10px;padding:10px;text-align:center}.stat strong{display:block;font-size:18px}.stat span{font-size:8px;color:#777;letter-spacing:1px}.bottom{display:none}.modal{position:fixed;inset:0;background:#000d;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.sheet{width:min(520px,100%);background:#111113;border:1px solid #39393d;border-radius:18px;padding:18px}.sheet input{width:100%;margin:8px 0;background:#080809;border:1px solid #39393d;border-radius:10px;color:#fff;padding:12px}.viewer{width:min(430px,100%);background:#050505;border-radius:18px;overflow:hidden;position:relative}.viewer img{display:block;width:100%;max-height:75vh;object-fit:contain;background:#000}.viewerText{padding:12px;font-size:12px;color:#ddd}.close{position:absolute;right:10px;top:10px;z-index:2;border:0;background:#000b;color:#fff;border-radius:50%;width:36px;height:36px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:900;display:none;z-index:80}.toast.show{display:block}@media(max-width:760px){.layout{display:block}.side{display:none}.top{height:58px}.wrap{padding:8px 8px 76px}.storiesCard{border-radius:14px}.story{min-width:68px;width:68px}.ring{width:64px;height:64px}.composer{border-radius:14px}.post{border-radius:14px}.bottom{position:fixed;display:flex;bottom:0;left:0;right:0;height:58px;background:#080808f5;border-top:1px solid #29292d;z-index:25;justify-content:space-around;align-items:center}.bottom button{background:none;border:0;color:#aaa;font-size:10px;font-weight:900}.bottom button.active{color:#fff}.top .pill{padding:8px 11px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/">GENDER <b>WARZ™</b></a><div class="actions"><button class="pill" id="profileBtn">PROFILE</button><button class="pill red" id="logout">LOG OUT</button></div></header>
<main class="wrap"><div class="layout"><section>
<div class="card storiesCard"><h3 class="sectionTitle">STORIES</h3><div class="stories" id="stories"></div></div>
<div class="card composer"><div class="composerTop"><div class="avatar" id="myAvatar">SP</div><textarea id="postText" maxlength="1000" placeholder="What's happening on the War Floor?"></textarea></div><div class="composerBar"><span class="hint" id="mediaHint">Text posts are instant. Add a photo below.</span><div><button class="pill" id="mediaBtn">📷 MEDIA</button><button class="pill red" id="postBtn">POST</button></div></div><input id="postFile" type="file" accept="image/*" hidden></div>
<div id="feed"></div></section>
<aside class="card side"><div class="sideProfile"><div class="bigAvatar" id="sideAvatar">SP</div><h2 id="sideName">Stackpack</h2><div class="handle" id="sideHandle">@Stackpack</div><div class="badges"><span class="badge blue">✓ VERIFIED</span><span class="badge gold">★ OFFICIAL ADMIN</span></div><p style="color:#bbb;font-size:11px;line-height:1.5">Founder and host of Gender Warz™. Welcome to the War Floor.</p><button class="pill red" id="sideProfileBtn">VIEW PROFILE</button><div class="stats"><div class="stat"><strong>50K</strong><span>FOLLOWERS</span></div><div class="stat"><strong id="postCount">0</strong><span>POSTS</span></div></div></div></aside>
</div></main>
<nav class="bottom"><button class="active" onclick="scrollTo({top:0,behavior:'smooth'})">HOME</button><button onclick="document.getElementById('postText').focus()">POST</button><button onclick="openStory()">STORY</button><button onclick="location.href='/members.html'">PROFILE</button></nav>
<div class="modal" id="storyModal"><div class="sheet"><h3 style="margin-top:0">Add to your Story</h3><p style="color:#888;font-size:11px">Stories are compressed and disappear automatically after 24 hours.</p><input id="storyFile" type="file" accept="image/*"><input id="storyCaption" placeholder="Add a caption..."><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="pill" onclick="closeStory()">CANCEL</button><button class="pill red" id="storyPost">POST STORY</button></div></div></div>
<div class="modal" id="viewer"><div class="viewer"><button class="close" onclick="closeViewer()">×</button><img id="viewerImg"><div class="viewerText" id="viewerText"></div></div></div><div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://kyxxslzvjaqmyzcvafzy.supabase.co',SUPABASE_KEY='sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let me=null,profile=null,selectedMedia=null;
const $=id=>document.getElementById(id);const esc=s=>(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const initials=s=>(s||'SP').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
function openStory(){$('storyModal').classList.add('open')}function closeStory(){$('storyModal').classList.remove('open');$('storyFile').value='';$('storyCaption').value=''}function closeViewer(){$('viewer').classList.remove('open')}
async function resizeImage(file,max=1200,q=.72){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{const scale=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*scale));c.height=Math.max(1,Math.round(i.height*scale));c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);resolve(b)},'image/webp',q)};i.onerror=reject;i.src=u})}
async function uploadImage(file,folder){const blob=await resizeImage(file,folder==='stories'?720:1400,folder==='stories'?.62:.72);const path=me.id+'/'+folder+'/'+crypto.randomUUID()+'.webp';const r=await sb.storage.from('social-media').upload(path,blob,{contentType:'image/webp',upsert:false});if(r.error)throw r.error;return sb.storage.from('social-media').getPublicUrl(path).data.publicUrl}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user){location.href='/members.html';return}me=user;const r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.error){toast('Profile error: '+r.error.message);return}profile=r.data;renderMe();await Promise.all([loadStories(),loadPosts(),loadPostCount()])}
function renderMe(){const n=profile.display_name||profile.username||'Stackpack';const av=profile.avatar_url;['myAvatar','sideAvatar'].forEach(id=>{const el=$(id);if(av)el.innerHTML='<img src="'+esc(av)+'">';else el.textContent=initials(n)});$('sideName').textContent=n;$('sideHandle').textContent='@'+(profile.username||'member');$('profileBtn').onclick=$('sideProfileBtn').onclick=()=>location.href='/members.html';$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/members.html'};}
async function loadStories(){const r=await sb.from('stories').select('id,media_url,caption,created_at,expires_at,profiles(username,display_name,avatar_url)').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});if(r.error){toast('Stories: '+r.error.message);return}let html='<div class="story add" onclick="openStory()"><div class="ring"><div class="ringInner">＋</div></div><div>Your story</div></div>';html+=(r.data||[]).map(s=>'<div class="story" onclick="showStory('+JSON.stringify(s.media_url)+','+JSON.stringify(s.caption||'')+')"><div class="ring"><div class="ringInner">'+(s.profiles?.avatar_url?'<img loading="lazy" src="'+esc(s.profiles.avatar_url)+'">':esc(initials(s.profiles?.display_name||s.profiles?.username)))+'</div></div><div>'+esc(s.profiles?.username||'member')+'</div></div>').join('');$('stories').innerHTML=html}
function showStory(url,caption){$('viewerImg').src=url;$('viewerText').textContent=caption||'';$('viewer').classList.add('open')}
async function loadPosts(){const r=await sb.from('posts').select('id,author_id,body,media_url,media_type,created_at,profiles(username,display_name,avatar_url,is_verified)').order('created_at',{ascending:false}).limit(50);if(r.error){$('feed').innerHTML='<div class="empty">Unable to load posts: '+esc(r.error.message)+'</div>';return}const data=r.data||[];$('feed').innerHTML=data.length?data.map(p=>{const n=p.profiles?.display_name||p.profiles?.username||'Member';const av=p.profiles?.avatar_url;return '<article class="card post"><div class="postHead"><div class="avatar">'+(av?'<img src="'+esc(av)+'">':esc(initials(n)))+'</div><div><strong>'+esc(n)+(p.profiles?.is_verified?'<span class="verified">✓</span>':'')+'</strong><small>@'+esc(p.profiles?.username||'member')+' · '+new Date(p.created_at).toLocaleString()+'</small></div></div>'+(p.body?'<div class="bodyText">'+esc(p.body)+'</div>':'')+(p.media_url?(p.media_type==='video'?'<video class="media" controls preload="metadata" src="'+esc(p.media_url)+'"></video>':'<img class="media" loading="lazy" src="'+esc(p.media_url)+'">'):'')+'</article>'}).join(''):'<div class="empty">No posts yet. Be the first one on the War Floor.</div>'}
async function loadPostCount(){const r=await sb.from('posts').select('*',{count:'exact',head:true}).eq('author_id',me.id);$('postCount').textContent=r.count||0}
$('mediaBtn').onclick=()=>$('postFile').click();$('postFile').onchange=e=>{selectedMedia=e.target.files[0];$('mediaHint').textContent=selectedMedia?'📷 '+selectedMedia.name:'Text posts are instant.'};$('postBtn').onclick=async()=>{const body=$('postText').value.trim();if(!body&&!selectedMedia){toast('Write something or choose media first.');return}const b=$('postBtn');b.disabled=true;try{let media_url=null,media_type=null;if(selectedMedia){if(!selectedMedia.type.startsWith('image/'))throw new Error('Please use an image for now.');media_url=await uploadImage(selectedMedia,'posts');media_type='image'}const r=await sb.from('posts').insert({author_id:me.id,body,media_url,media_type});if(r.error)throw r.error;$('postText').value='';$('postFile').value='';selectedMedia=null;$('mediaHint').textContent='Posted successfully.';await loadPosts();await loadPostCount();toast('Posted to the War Floor');}catch(e){toast('Post failed: '+e.message)}finally{b.disabled=false}};
$('storyPost').onclick=async()=>{const f=$('storyFile').files[0];if(!f){toast('Choose a photo first.');return}const b=$('storyPost');b.disabled=true;try{const url=await uploadImage(f,'stories');const r=await sb.from('stories').insert({author_id:me.id,media_url:url,media_type:'image',caption:$('storyCaption').value.trim(),expires_at:new Date(Date.now()+86400000).toISOString()});if(r.error)throw r.error;closeStory();await loadStories();toast('Story posted for 24 hours');}catch(e){toast('Story failed: '+e.message)}finally{b.disabled=false}};
init();
</script>
</body></html>
