<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gender Warz™ | Social</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script><style>:root{--bg:#050505;--card:#0d0d0f;--line:#29292d;--muted:#8d8d94;--red:#ff3347;--blue:#2da8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;height:60px;background:#050505f5;backdrop-filter:blur(14px);border-bottom:1px solid #242428;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.brand{color:#fff;text-decoration:none;font-weight:1000;letter-spacing:3px}.brand b{color:var(--red)}.pill{border:1px solid #3a3a3e;background:#111113;color:#fff;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:900}.red{background:var(--red)!important;border-color:var(--red)!important}.wrap{width:min(1050px,100%);margin:auto;padding:12px 10px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px}.stories{padding:14px 12px;margin-bottom:12px;display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{min-width:78px;width:78px;text-align:center;color:#aaa;font-size:9px;background:none;border:0;padding:0}.ring{width:70px;height:70px;padding:3px;border-radius:50%;background:linear-gradient(135deg,#ff3347,#ffd166,#2da8ff);margin:auto auto 5px}.inner{width:100%;height:100%;border:3px solid #0d0d0f;border-radius:50%;overflow:hidden;background:#19191c;display:grid;place-items:center;position:relative}.inner img{width:100%;height:100%;object-fit:cover}.storyName{display:flex;justify-content:center;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--blue);font-size:8px;font-weight:1000;flex:0 0 auto}.layout{display:grid;grid-template-columns:minmax(0,680px) 280px;gap:14px}.composer,.post,.side{padding:14px;margin-bottom:12px}.composerTop{display:flex;gap:10px}.avatar{width:44px;height:44px;flex:0 0 44px;border-radius:50%;background:#27272b;display:grid;place-items:center;overflow:hidden;font-weight:1000}.avatar img{width:100%;height:100%;object-fit:cover}.composer textarea{width:100%;min-height:74px;resize:none;background:#080809;border:1px solid #39393d;border-radius:12px;color:#fff;padding:12px;outline:none}.bar{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}.hint{color:#777;font-size:10px}.postHead{display:flex;align-items:center;gap:10px}.postHead small{display:block;color:#777;margin-top:2px;font-size:10px}.body{white-space:pre-wrap;color:#ddd;line-height:1.5;margin:12px 0}.media{width:100%;max-height:600px;object-fit:cover;border-radius:12px;background:#000}.modal{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.sheet{width:min(520px,100%);background:#111113;border:1px solid #39393d;border-radius:18px;padding:18px}.sheet input{width:100%;margin:8px 0;background:#080809;border:1px solid #39393d;border-radius:10px;color:#fff;padding:12px}.progress{height:6px;background:#222;border-radius:99px;overflow:hidden;display:none;margin-top:10px}.progress.show{display:block}.progress i{display:block;height:100%;width:0;background:var(--red)}.error{color:#ff6675;font-size:11px;margin-top:8px}.viewer{width:min(430px,100%);max-height:92vh;background:#050505;border:1px solid #39393d;border-radius:18px;overflow:hidden;position:relative}.viewer img,.viewer video{display:block;width:100%;max-height:72vh;object-fit:contain;background:#000}.viewerMeta{padding:10px 14px 0;color:#aaa;font-size:10px}.viewerText{padding:10px 14px;color:#ddd;font-size:12px}.viewerActions{display:flex;gap:8px;padding:0 14px 14px}.viewerActions button,.viewerActions a{flex:1;text-align:center;border-radius:999px;padding:11px 8px;font-size:10px;font-weight:1000;text-decoration:none;border:1px solid #555;background:#111;color:#fff}.viewerActions .watch{background:var(--red);border-color:var(--red)}.delete{background:#1a0b0e!important;border-color:#8b2332!important;color:#ff7787!important}.empty{padding:30px;text-align:center;color:#777;border:1px dashed #303035;border-radius:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border-radius:999px;padding:10px 15px;font-size:11px;font-weight:900;display:none;z-index:80}.toast.show{display:block}@media(max-width:760px){.layout{display:block}.side{display:none}.top{height:58px}.stories{border-radius:14px}.story{min-width:70px;width:70px}.ring{width:64px;height:64px}.viewer{width:100%;max-height:100dvh;height:100dvh;border-radius:0}.viewer img,.viewer video{max-height:70dvh}}</style></head><body><header class="top"><a class="brand" href="/">GENDER <b>WARZ™</b></a><div><button class="pill" id="profile">PROFILE</button><button class="pill red" id="logout">LOG OUT</button></div></header><main class="wrap"><section class="card stories" id="stories"><button class="story" id="addStory"><div class="ring"><div class="inner">＋</div></div><div class="storyName">Your story</div></button></section><div class="layout"><section><div class="card composer"><div class="composerTop"><div class="avatar" id="myAvatar">SP</div><textarea id="postText" maxlength="1000" placeholder="What's happening on the War Floor?"></textarea></div><div class="bar"><span class="hint" id="mediaHint">Text posts are instant. Add photo or video.</span><div><button class="pill" id="mediaBtn">📷 MEDIA</button><button class="pill red" id="postBtn">POST</button></div></div><input id="postFile" type="file" accept="image/*,video/*" hidden></div><div id="feed"></div></section><aside class="card side"><div style="text-align:center"><div class="avatar" id="sideAvatar" style="width:92px;height:92px;margin:auto;font-size:28px">SP</div><h2 id="sideName">Stackpack</h2><div style="color:#777;font-size:11px" id="sideHandle">@Stackpack</div><p style="color:#bbb;font-size:11px;line-height:1.5">Founder and host of Gender Warz™. Welcome to the War Floor.</p><button class="pill red" id="sideProfile">VIEW PROFILE</button></div></aside></div></main><div class="modal" id="storyModal"><div class="sheet"><h3>Add to your Story</h3><p style="color:#888;font-size:11px">Photos are automatically compressed. Videos up to 100 MB are supported.</p><input id="storyFile" type="file" accept="image/*,video/*"><input id="storyCaption" maxlength="300" placeholder="Add a caption..."><div class="progress" id="progress"><i id="progressBar"></i></div><div class="error" id="storyError"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="pill" id="cancelStory">CANCEL</button><button class="pill red" id="postStory">POST STORY</button></div></div></div><div class="modal" id="viewerModal"><div class="viewer"><div id="viewerMedia"></div><div class="viewerMeta" id="viewerMeta"></div><div class="viewerText" id="viewerText"></div><div class="viewerActions"><button class="watch" id="watch">▶ WATCH STORY</button><a id="viewProfile" href="#">👤 VIEW PROFILE</a><button class="delete" id="deleteStory" style="display:none">🗑 DELETE STORY</button></div><button class="pill" id="closeViewer" style="position:absolute;right:10px;top:10px;z-index:3">×</button></div></div><div class="toast" id="toast"></div><script>const sb=window.supabase.createClient('https://kyxxslzvjaqmyzcvafzy.supabase.co','sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6');const BUCKET='social-media';let me=null,profile=null,currentStory=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const initials=s=>String(s||'SP').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.remove('show'),3000)}function profileUrl(s){return '/public-profile.html?username='+encodeURIComponent(s.profiles?.username||s.author_id||'')}function closeViewer(){const v=$('viewerMedia').querySelector('video');if(v)v.pause();$('viewerMedia').innerHTML='';$('viewerModal').classList.remove('open');currentStory=null}function openStory(s){currentStory=s;const p=s.profiles||{},n=p.display_name||p.username||'Member';$('viewerMeta').innerHTML=esc(n)+(p.is_verified?' <span class="verified">✓</span>':'')+(p.username?' @'+esc(p.username):'');$('viewerText').textContent=s.caption||'';$('viewProfile').href=profileUrl(s);$('deleteStory').style.display=s.author_id===me.id?'block':'none';$('viewerMedia').innerHTML='';if(s.media_type==='video'){const v=document.createElement('video');v.src=s.media_url;v.controls=true;v.autoplay=true;v.playsInline=true;v.muted=true;$('viewerMedia').appendChild(v)}else{const img=document.createElement('img');img.src=s.media_url;img.alt=n;$('viewerMedia').appendChild(img)}$('viewerModal').classList.add('open')}async function deleteCurrentStory(){if(!currentStory||currentStory.author_id!==me.id)return;const id=currentStory.id;if(!confirm('Delete this story? This cannot be undone.'))return;$('deleteStory').disabled=true;try{const r=await sb.from('stories').delete().eq('id',id).eq('author_id',me.id);if(r.error)throw r.error;try{const marker='/storage/v1/object/public/'+BUCKET+'/';const i=currentStory.media_url.indexOf(marker);if(i>=0){const path=decodeURIComponent(currentStory.media_url.slice(i+marker.length));await sb.storage.from(BUCKET).remove([path])}}catch(_){}closeViewer();await loadStories();toast('Story deleted.')}catch(e){toast('Could not delete story: '+e.message)}finally{$('deleteStory').disabled=false}}function setProgress(n){$('progress').classList.add('show');$('progressBar').style.width=n+'%'}async function compressImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read this image.'));i.src=url});let max=1400,q=.78;for(let a=0;a<7;a++){const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const b=await new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(new Error('Compression failed')),'image/webp',q));if(b.size<=900*1024)return b;if(q>.42)q-=.08;else max=Math.max(640,Math.round(max*.8))}throw new Error('Image is too large to optimize for Stories.')}finally{URL.revokeObjectURL(url)}}async function uploadFile(file,onProgress){if(file.size>100*1024*1024)throw new Error('Story files must be 100 MB or smaller.');const base=me.id+'/stories/'+crypto.randomUUID();if(file.type.startsWith('image/')){const b=await compressImage(file);const path=base+'.webp';const r=await sb.storage.from(BUCKET).upload(path,b,{contentType:'image/webp',upsert:false});if(r.error)throw r.error;onProgress(100);return{url:sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,type:'image'}}if(file.type.startsWith('video/')){const path=base+'.'+((file.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,'')||'mp4');const session=(await sb.auth.getSession()).data.session;if(file.size>6*1024*1024){if(!session)throw new Error('Your login session expired.');return await new Promise((resolve,reject)=>{const up=new tus.Upload(file,{endpoint:'https://kyxxslzvjaqmyzcvafzy.storage.supabase.co/storage/v1/upload/resumable',retryDelays:[0,3000,5000,10000],headers:{authorization:'Bearer '+session.access_token,apikey:'sb_publishable_Kq0y_C9lMNHqvX-o55oCJA_px3rtTG6'},uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,chunkSize:6*1024*1024,metadata:{bucketName:BUCKET,objectName:path,contentType:file.type,cacheControl:'3600'},onProgress:(a,b)=>onProgress(Math.round(a/b*100)),onError:e=>reject(new Error(e.message||'Video upload failed')),onSuccess:()=>resolve({url:sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,type:'video'})});up.start()})}const r=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;onProgress(100);return{url:sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl,type:'video'}}throw new Error('Choose an image or video.')}async function loadStories(){let r=await sb.from('stories').select('id,author_id,media_url,media_type,caption,created_at,expires_at,profiles(username,display_name,avatar_url,is_verified)').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});if(r.error)r=await sb.from('stories').select('id,author_id,media_url,media_type,caption,created_at,expires_at').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});const data=r.data||[];const row=$('stories');row.querySelectorAll('[data-story]').forEach(x=>x.remove());data.forEach(s=>{const p=s.profiles||{},n=p.display_name||p.username||'Member',b=document.createElement('button');b.className='story';b.dataset.story=s.id;b.innerHTML='<div class="ring"><div class="inner">'+(p.avatar_url?'<img src="'+esc(p.avatar_url)+'" alt="">':esc(initials(n)))+'</div></div><div class="storyName">'+esc(n)+(p.is_verified?'<span class="verified">✓</span>':'')+'</div>';b.onclick=()=>openStory(s);row.appendChild(b)})}async function loadPosts(){const r=await sb.from('posts').select('id,author_id,body,media_url,media_type,created_at,profiles(username,display_name,avatar_url,is_verified)').order('created_at',{ascending:false}).limit(50);if(r.error){$('feed').innerHTML='<div class="empty">Unable to load posts.</div>';return}const d=r.data||[];$('feed').innerHTML=d.length?d.map(p=>{const n=p.profiles?.display_name||p.profiles?.username||'Member',av=p.profiles?.avatar_url;return '<article class="card post"><div class="postHead"><div class="avatar">'+(av?'<img src="'+esc(av)+'">':esc(initials(n)))+'</div><div><strong>'+esc(n)+(p.profiles?.is_verified?'<span class="verified">✓</span>':'')+'</strong><small>@'+esc(p.profiles?.username||'member')+'</small></div></div>'+(p.body?'<div class="body">'+esc(p.body)+'</div>':'')+(p.media_url?(p.media_type==='video'?'<video class="media" controls src="'+esc(p.media_url)+'"></video>':'<img class="media" src="'+esc(p.media_url)+'">'):'')+'</article>'}).join(''):'<div class="empty">No posts yet.</div>'}async function init(){const a=await sb.auth.getUser();if(!a.data.user){location.href='/members.html';return}me=a.data.user;const p=await sb.from('profiles').select('*').eq('id',me.id).single();if(p.error){toast(p.error.message);return}profile=p.data;const name=profile.display_name||profile.username||'Stackpack';$('sideName').textContent=name;$('sideHandle').textContent='@'+(profile.username||'member');for(const id of ['myAvatar','sideAvatar']){const e=$(id);e.innerHTML=profile.avatar_url?'<img src="'+esc(profile.avatar_url)+'" alt="">':esc(initials(name))}await Promise.all([loadStories(),loadPosts()])}$('addStory').onclick=()=>$('storyModal').classList.add('open');$('cancelStory').onclick=()=>{$('storyModal').classList.remove('open');$('storyFile').value='';$('storyCaption').value='';$('storyError').textContent='';$('progress').classList.remove('show')};$('postStory').onclick=async()=>{const f=$('storyFile').files[0];if(!f){$('storyError').textContent='Choose a photo or video.';return}const b=$('postStory');b.disabled=true;$('storyError').textContent='';try{const m=await uploadFile(f,setProgress);const r=await sb.from('stories').insert({author_id:me.id,media_url:m.url,media_type:m.type,caption:$('storyCaption').value.trim(),expires_at:new Date(Date.now()+86400000).toISOString()});if(r.error)throw r.error;$('cancelStory').click();await loadStories();toast('Story posted — live for 24 hours.')}catch(e){$('storyError').textContent=e.message||'Story upload failed.';toast('Story upload failed.')}finally{b.disabled=false}};$('deleteStory').onclick=deleteCurrentStory;$('closeViewer').onclick=closeViewer;$('viewerModal').onclick=e=>{if(e.target===$('viewerModal'))closeViewer()};$('watch').onclick=()=>{const v=$('viewerMedia').querySelector('video');if(v){v.muted=false;v.play().catch(()=>{})}};$('profile').onclick=()=>location.href='/members.html';$('sideProfile').onclick=()=>location.href='/members.html';$('logout').onclick=async()=>{await sb.auth.signOut();location.href='/members.html'};$('mediaBtn').onclick=()=>$('postFile').click();$('postFile').onchange=e=>$('mediaHint').textContent=e.target.files[0]?'🎬 '+e.target.files[0].name:'Text posts are instant. Add photo or video.';$('postBtn').onclick=async()=>{const body=$('postText').value.trim(),f=$('postFile').files[0];if(!body&&!f){toast('Write something or choose media first.');return}const b=$('postBtn');b.disabled=true;try{let media_url=null,media_type=null;if(f){const m=await uploadFile(f,()=>{});media_url=m.url;media_type=m.type}const r=await sb.from('posts').insert({author_id:me.id,body,media_url,media_type});if(r.error)throw r.error;$('postText').value='';$('postFile').value='';$('mediaHint').textContent='Posted successfully.';await loadPosts();toast('Posted to the War Floor')}catch(e){toast('Post failed: '+e.message)}finally{b.disabled=false}};init();</script></body></html>
